name: Security and functionality

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/constraints.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm ci --ignore-scripts
      - run: npm run build:css
      - run: git diff --exit-code -- static/app.css
      - run: python -m ruff check backend quickstart.py tests --select E9,F63,F7,F82
      - run: python -m pytest backend -q
      - run: python -m pip_audit -r backend/requirements.txt
      - run: python -m pip check
      - run: npm audit
